# Builds once, then deploys that same dist/ to Firebase Hosting (main) and GitHub Pages (backup).
# Repository settings needed (see SETUP.md):
#   Variables: GOOGLE_CLIENT_ID, FIREBASE_PROJECT_ID, READ_ONLY (optional, "true" or "false")
#   Secret:    FIREBASE_SERVICE_ACCOUNT (JSON key of a service account with Firebase Hosting Admin)
#   Pages:     Settings → Pages → Source: GitHub Actions
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install cryptography argon2-cffi
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:py
      - name: Build (one build for both hosts)
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_READ_ONLY: ${{ vars.READ_ONLY || 'false' }}
      - name: recovery/recovery.html must be committed and up to date
        run: git diff --exit-code recovery/recovery.html
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          if-no-files-found: error
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-firebase:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
